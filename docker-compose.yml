# CinePass orientado a eventos: infraestrutura, observabilidade e os oito serviços.
#
#   docker compose up -d --build        tudo (primeira subida leva alguns minutos)
#   docker compose ps                   estado de cada container
#   docker compose down -v              derruba e apaga bancos, tópicos e índices
#
# Só a infraestrutura, para rodar os serviços pela IDE:
#
#   docker compose up -d postgres kafka kafka-ui zipkin elasticsearch logstash kibana kibana-setup discovery-server
#
# Painéis:
#   API Gateway   http://localhost:8080        Kafka UI   http://localhost:8090
#   Eureka        http://localhost:8761        Zipkin     http://localhost:9411
#   Kibana        http://localhost:5601

name: cinepass

# Todos os containers de longa duração usam restart: unless-stopped. Depois de reiniciar o
# Docker ou a máquina, infraestrutura e serviços voltam juntos; se só os serviços voltassem,
# ficariam reiniciando sem banco e sem Kafka.

x-servico: &servico
  build: &build
    context: .
  restart: unless-stopped
  mem_limit: 640m
  depends_on: &depende
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    discovery-server:
      condition: service_healthy
    logstash:
      condition: service_started
    zipkin:
      condition: service_started

x-ambiente: &ambiente
  DB_USERNAME: cinepass
  DB_PASSWORD: cinepass
  EUREKA_URL: http://discovery-server:8761/eureka/
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  LOGSTASH_DESTINO: logstash:5000

services:

  # ------------------------------------------------------------------ infraestrutura

  postgres:
    image: postgres:18-alpine
    container_name: cinepass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinepass
      POSTGRES_PASSWORD: cinepass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # A partir do PostgreSQL 18 o volume é montado em /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinepass -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    container_name: cinepass-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft: sem ZooKeeper. O nó acumula broker e controller, aceitável em desenvolvimento.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dois ouvintes: um para quem roda na máquina (localhost:9092), outro para os containers (kafka:29092).
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Os tópicos são declarados pelos serviços (NewTopic), com 3 partições. Este padrão
      # só vale se algum tópico for criado automaticamente antes disso.
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: cinepass-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cinepass
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------------ observabilidade

  zipkin:
    image: openzipkin/zipkin:3
    container_name: cinepass-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"

  elasticsearch:
    image: elasticsearch:9.5.3
    container_name: cinepass-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Ambiente de desenvolvimento: sem TLS e sem usuário. Em produção, ligar a segurança.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  logstash:
    image: logstash:9.5.3
    container_name: cinepass-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms384m -Xmx384m
      xpack.monitoring.enabled: "false"
    ports:
      - "5000:5000"
    volumes:
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: kibana:9.5.3
    container_name: cinepass-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      # Sem os avisos de telemetria e de cluster sem TLS, que cobrem a tela do Discover.
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
      SECURITY_SHOWINSECURECLUSTERWARNING: "false"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana-setup:
    image: curlimages/curl:latest
    container_name: cinepass-kibana-setup
    entrypoint: ["sh", "/configurar.sh"]
    volumes:
      - ./infra/kibana/configurar.sh:/configurar.sh:ro
    depends_on:
      kibana:
        condition: service_started
    restart: "no"

  # ------------------------------------------------------------------ plataforma

  discovery-server:
    build:
      context: .
      args:
        MODULO: discovery-server
    container_name: cinepass-discovery
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8761:8761"
    environment:
      LOGSTASH_DESTINO: logstash:5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      logstash:
        condition: service_started

  api-gateway:
    <<: *servico
    build:
      <<: *build
      args:
        MODULO: api-gateway
    container_name: cinepass-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *ambiente
    depends_on:
      discovery-server:
        condition: service_healthy
      zipkin:
        condition: service_started
      logstash:
        condition: service_started

  reserva-service:
    <<: *servico
    build:
      <<: *build
      args:
        MODULO: reserva-service
    container_name: cinepass-reserva
    ports:
      - "8081:8081"
    environment:
      <<: *ambiente
      DB_URL: jdbc:postgresql://postgres:5432/cinepass_db

  pagamento-service:
    <<: *servico
    build:
      <<: *build
      args:
        MODULO: pagamento-service
    container_name: cinepass-pagamento
    ports:
      - "8082:8082"
    environment:
      <<: *ambiente
      DB_URL: jdbc:postgresql://postgres:5432/pagamento_db

  ingresso-service:
    <<: *servico
    build:
      <<: *build
      args:
        MODULO: ingresso-service
    container_name: cinepass-ingresso
    ports:
      - "8083:8083"
    environment:
      <<: *ambiente
      DB_URL: jdbc:postgresql://postgres:5432/ingresso_db

  notificacao-service:
    <<: *servico
    build:
      <<: *build
      args:
        MODULO: notificacao-service
    container_name: cinepass-notificacao
    ports:
      - "8084:8084"
    environment:
      <<: *ambiente
      DB_URL: jdbc:postgresql://postgres:5432/notificacao_db

  reputacao-service:
    <<: *servico
    build:
      <<: *build
      args:
        MODULO: reputacao-service
    container_name: cinepass-reputacao
    ports:
      - "8085:8085"
    environment:
      <<: *ambiente
      DB_URL: jdbc:postgresql://postgres:5432/reputacao_db

  auditoria-service:
    <<: *servico
    build:
      <<: *build
      args:
        MODULO: auditoria-service
    container_name: cinepass-auditoria
    ports:
      - "8086:8086"
    environment:
      <<: *ambiente
      DB_URL: jdbc:postgresql://postgres:5432/auditoria_db

volumes:
  postgres-data:
  elasticsearch-data:
