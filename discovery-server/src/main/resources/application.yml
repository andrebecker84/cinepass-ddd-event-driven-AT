server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-server

cinepass:
  logging:
    logstash:
      destino: ${LOGSTASH_DESTINO:localhost:5000}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    wait-time-in-ms-when-sync-empty: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
