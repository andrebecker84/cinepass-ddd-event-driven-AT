# Recebe os logs dos microsservicos (JSON por linha, via TCP, enviados pelo
# LogstashTcpSocketAppender de cada servico) e indexa no Elasticsearch.
#
# Os campos de contexto ja chegam prontos do MDC: service, traceId, spanId,
# correlationId, reservaId, eventId, eventType. Nenhum parse de texto e necessario.

input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Metadados da conexao TCP nao interessam a consulta.
  mutate {
    remove_field => ["port", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cinepass-logs-%{+YYYY.MM.dd}"
  }
}
