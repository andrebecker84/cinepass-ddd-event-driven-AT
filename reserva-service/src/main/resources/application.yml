server:
  port: ${SERVER_PORT:8081}

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  application:
    name: reserva-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinepass_db}
    username: ${DB_USERNAME:cinepass}
    password: ${DB_PASSWORD:cinepass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Produtor idempotente: o broker descarta a repetição de um envio que o produtor
      # refez por timeout, e a ordem dentro da partição se mantém mesmo com reenvio.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    template:
      # Cria o span do envio e injeta o traceparent nos cabeçalhos do registro.
      observation-enabled: true

cinepass:
  mensageria:
    outbox:
      habilitado: true
      intervalo: 500ms
  logging:
    logstash:
      destino: ${LOGSTASH_DESTINO:localhost:5000}

eureka:
  client:
    # Em desenvolvimento, descobrir instâncias novas em segundos, e não em até um minuto.
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
